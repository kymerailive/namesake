plugins {
    id 'net.neoforged.moddev'
}

// --- shared: compile :common's sources against NeoForge's Minecraft ---
configurations {
    commonJava { canBeResolved = true }
    commonResources { canBeResolved = true }
}

dependencies {
    commonJava project(path: ':common', configuration: 'commonJava')
    commonResources project(path: ':common', configuration: 'commonResources')
}

neoForge {
    version = rootProject.neoforge_version

    parchment {
        minecraftVersion = rootProject.parchment_minecraft
        mappingsVersion = rootProject.parchment_version
    }

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        "${rootProject.mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

tasks.named('compileJava', JavaCompile) {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
}

tasks.named('processResources', ProcessResources) {
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)

    def props = [
            mod_id                     : rootProject.mod_id,
            mod_name                   : rootProject.mod_name,
            mod_version                : project.version,
            mod_author                 : rootProject.mod_author,
            mod_description            : rootProject.mod_description,
            mod_homepage               : rootProject.mod_homepage,
            mod_sources                : rootProject.mod_sources,
            mod_issues                 : rootProject.mod_issues,
            license                    : rootProject.license,
            minecraft_version_range    : rootProject.minecraft_version_range,
            neoforge_loader_version_range: rootProject.neoforge_loader_version_range,
            neoforge_version_range     : rootProject.neoforge_version_range
    ]
    inputs.properties(props)
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(props)
    }
}

tasks.named('sourcesJar', Jar) {
    dependsOn(configurations.commonJava)
    from(configurations.commonJava)
}
