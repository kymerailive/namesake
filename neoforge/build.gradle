plugins {
    id 'net.neoforged.moddev'
}

// --- shared: compile :common's sources against NeoForge's Minecraft ---
configurations {
    commonJava { canBeResolved = true }
    commonResources { canBeResolved = true }
}

dependencies {
    commonJava project(path: ':common', configuration: 'commonJava')
    commonResources project(path: ':common', configuration: 'commonResources')
}

neoForge {
    version = rootProject.neoforge_version

    parchment {
        minecraftVersion = rootProject.parchment_minecraft
        mappingsVersion = rootProject.parchment_version
    }

    runs {
        client {
            client()
            // See fabric/build.gradle: the attach-bet harness only runs when asked for.
            //   .\gradlew.bat :neoforge:runClient -Pharness=setup
            if (project.hasProperty('harness')) {
                systemProperty('namesake.harness', project.property('harness').toString())
            }
        }
        server {
            server()
        }
    }

    mods {
        "${rootProject.mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

// --- hard rule 6, on the far side of the seam ------------------------------------------------
//
// See the twin of this block in fabric/build.gradle. A unit test in :common cannot see this
// module, and this is exactly where an unguarded handler would be registered.
//
// The forbidden names are PayloadRegistrar's registration methods, not RegisterPayloadHandlersEvent
// itself: the transport is flushed from a listener the mod class installs, so naming the event is
// legitimate. Calling playToServer is not.
def networkRegistrationAllowlist = ['NeoForgeVerbTransport.java']
def networkRegistrationCalls = ~/playToServer|playToClient|playBidirectional|commonToServer|commonToClient|commonBidirectional|configurationToServer|configurationToClient|configurationBidirectional/

def verifyPacketRegistration = tasks.register('verifyPacketRegistration') {
    description = 'Fails if any file but the transport registers a NeoForge payload (CLAUDE.md hard rule 6).'
    def sources = fileTree('src/main/java') { include '**/*.java' }
    inputs.files(sources).withPathSensitivity(PathSensitivity.RELATIVE)
    outputs.upToDateWhen { true }

    doLast {
        def offenders = sources.files.findAll { file ->
            !(file.name in networkRegistrationAllowlist) && file.text =~ networkRegistrationCalls
        }
        if (!offenders.isEmpty()) {
            throw new GradleException(
                    "NeoForge payload registration outside the transport seam:\n" +
                    offenders.collect { "  - ${it}" }.join('\n') +
                    "\nEvery serverbound packet must arrive through ServerboundVerb's gate. Add a " +
                    "verb to VerbCatalog instead of registering a handler here. CLAUDE.md hard rule 6.")
        }
    }
}

tasks.named('compileJava', JavaCompile) {
    dependsOn(configurations.commonJava)
    dependsOn(verifyPacketRegistration)
    source(configurations.commonJava)
}

tasks.named('processResources', ProcessResources) {
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)

    def props = [
            mod_id                     : rootProject.mod_id,
            mod_name                   : rootProject.mod_name,
            mod_version                : project.version,
            mod_author                 : rootProject.mod_author,
            mod_description            : rootProject.mod_description,
            mod_homepage               : rootProject.mod_homepage,
            mod_sources                : rootProject.mod_sources,
            mod_issues                 : rootProject.mod_issues,
            license                    : rootProject.license,
            minecraft_version_range    : rootProject.minecraft_version_range,
            neoforge_loader_version_range: rootProject.neoforge_loader_version_range,
            neoforge_version_range     : rootProject.neoforge_version_range
    ]
    inputs.properties(props)
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(props)
    }
}

tasks.named('sourcesJar', Jar) {
    dependsOn(configurations.commonJava)
    from(configurations.commonJava)
}
