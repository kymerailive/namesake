plugins {
    id 'net.neoforged.moddev'
}

// The common module compiles against vanilla Minecraft via NeoForm — no loader, no loader APIs.
// Loader-specific behaviour lives behind interfaces in net.namesake.platform, implemented in
// :fabric and :neoforge and resolved with java.util.ServiceLoader.
neoForge {
    neoFormVersion = rootProject.neo_form_version
    parchment {
        minecraftVersion = rootProject.parchment_minecraft
        mappingsVersion = rootProject.parchment_version
    }

    // Put vanilla Minecraft on the test compile classpath as well as main. Without it the test
    // source set cannot see net.minecraft at all, which would quietly restrict unit tests to code
    // that touches no Minecraft type — i.e. away from persistence, which is the part most worth
    // testing. testImplementation extends implementation, but modding dependencies are not added
    // through implementation, so this is not automatic.
    addModdingDependenciesTo(sourceSets.test)
}

dependencies {
    testImplementation platform("org.junit:junit-bom:${rootProject.junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Test-only. See the note on asm_version in gradle.properties.
    testImplementation "org.ow2.asm:asm:${rootProject.asm_version}"
}

// The classpath-scanning tests walk the compiled main classes rather than the source tree, because
// a payload declared but never compiled is not a payload. Handing them the directory explicitly
// beats guessing at it from a classloader.
tasks.named('test', Test) {
    systemProperty 'namesake.mainClasses',
            sourceSets.main.output.classesDirs.singleFile.absolutePath
    systemProperty 'namesake.repoRoot', rootProject.projectDir.absolutePath
}

// Expose the raw sources so the loader modules can compile them against their own remapped
// Minecraft. Sharing sources rather than a jar is what keeps 96% of the code loader-agnostic.
configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

def commonResourcesOutput = layout.buildDirectory.dir('commonResources')

tasks.register('prepareCommonResources', Sync) {
    from(sourceSets.main.resources)
    into(commonResourcesOutput)
    duplicatesStrategy = DuplicatesStrategy.FAIL
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources(commonResourcesOutput) {
        builtBy tasks.named('prepareCommonResources')
    }
}
