plugins {
    id 'fabric-loom'
}

// --- shared: compile :common's sources against Fabric's remapped Minecraft ---
configurations {
    commonJava { canBeResolved = true }
    commonResources { canBeResolved = true }
}

dependencies {
    commonJava project(path: ':common', configuration: 'commonJava')
    commonResources project(path: ':common', configuration: 'commonResources')

    minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${rootProject.parchment_minecraft}:${rootProject.parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
}

// The attach-bet harness (session 01) drives a real client through the persona lifecycle. It is
// inert unless this property is set, and it must stay that way — it rewrites game rules, moves the
// player and kills a villager.
//   .\gradlew.bat :fabric:runClient -Pharness=setup
loom {
    runs {
        client {
            if (project.hasProperty('harness')) {
                property('namesake.harness', project.property('harness').toString())
            }
        }
    }
}

// --- hard rule 6, on the far side of the seam ------------------------------------------------
//
// Every serverbound packet arrives through ServerboundVerb's gate, and VerbGateTest proves that
// for everything in :common. It cannot prove it here: a unit test in :common cannot see this
// module, and this is precisely where someone would call Fabric's networking API directly and get
// an unguarded handler. So the build reads the sources instead.
//
// Deliberately a source scan and not a bytecode one: it must fire before compilation, and the
// message has to name the file a person can go and fix.
def networkRegistrationAllowlist = ['FabricVerbTransport.java', 'FabricClientReceivers.java']
def networkRegistrationCalls = ~/PayloadTypeRegistry|registerGlobalReceiver|ServerPlayNetworking\s*\.\s*registerReceiver/

def verifyPacketRegistration = tasks.register('verifyPacketRegistration') {
    description = 'Fails if any file but the transport registers a Fabric payload (CLAUDE.md hard rule 6).'
    def sources = fileTree('src/main/java') { include '**/*.java' }
    inputs.files(sources).withPathSensitivity(PathSensitivity.RELATIVE)
    outputs.upToDateWhen { true }

    doLast {
        def offenders = sources.files.findAll { file ->
            !(file.name in networkRegistrationAllowlist) && file.text =~ networkRegistrationCalls
        }
        if (!offenders.isEmpty()) {
            throw new GradleException(
                    "Fabric payload registration outside the transport seam:\n" +
                    offenders.collect { "  - ${it}" }.join('\n') +
                    "\nEvery serverbound packet must arrive through ServerboundVerb's gate. Add a " +
                    "verb to VerbCatalog instead of registering a receiver here. CLAUDE.md hard rule 6.")
        }
    }
}

tasks.named('compileJava', JavaCompile) {
    dependsOn(configurations.commonJava)
    dependsOn(verifyPacketRegistration)
    source(configurations.commonJava)
}

tasks.named('processResources', ProcessResources) {
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)

    def props = [
            mod_id                : rootProject.mod_id,
            mod_name              : rootProject.mod_name,
            mod_version           : project.version,
            mod_author            : rootProject.mod_author,
            mod_description       : rootProject.mod_description,
            mod_homepage          : rootProject.mod_homepage,
            mod_sources           : rootProject.mod_sources,
            mod_issues            : rootProject.mod_issues,
            license               : rootProject.license,
            // Fabric parses semver predicates, NOT Maven ranges. Using the NeoForge property here
            // builds cleanly and then fails at load with an unsatisfiable-range error.
            fabric_minecraft_version_range: rootProject.fabric_minecraft_version_range,
            fabric_loader_version : rootProject.fabric_loader_version,
            java_version          : rootProject.java_version
    ]
    inputs.properties(props)

    // Guard against the Maven-vs-semver trap. A Maven range here builds perfectly and then makes
    // Fabric refuse to load the mod at runtime with "unsatisfiable version range". Cheap to check,
    // invisible to catch any other way.
    doFirst {
        props.findAll { k, v -> k.toString().startsWith('fabric_') && k.toString().endsWith('_version_range') }
                .each { k, v ->
                    if (v.toString() ==~ /^\s*[\[(].*[\])]\s*$/) {
                        throw new GradleException(
                                "gradle.properties '${k}' is a Maven range ('${v}'). Fabric needs a " +
                                "semver predicate such as '>=1.21 <1.22'. Maven ranges build fine and " +
                                "then fail at mod load.")
                    }
                }
    }

    filesMatching('fabric.mod.json') {
        expand(props)
    }
}

tasks.named('sourcesJar', Jar) {
    dependsOn(configurations.commonJava)
    from(configurations.commonJava)
}

repositories {
    maven {
        name = 'ParchmentMC'
        url = uri('https://maven.parchmentmc.org')
    }
}
