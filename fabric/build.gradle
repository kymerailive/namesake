plugins {
    id 'fabric-loom'
}

// --- shared: compile :common's sources against Fabric's remapped Minecraft ---
configurations {
    commonJava { canBeResolved = true }
    commonResources { canBeResolved = true }
}

dependencies {
    commonJava project(path: ':common', configuration: 'commonJava')
    commonResources project(path: ':common', configuration: 'commonResources')

    minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${rootProject.parchment_minecraft}:${rootProject.parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
}

tasks.named('compileJava', JavaCompile) {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
}

tasks.named('processResources', ProcessResources) {
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)

    def props = [
            mod_id                : rootProject.mod_id,
            mod_name              : rootProject.mod_name,
            mod_version           : project.version,
            mod_author            : rootProject.mod_author,
            mod_description       : rootProject.mod_description,
            mod_homepage          : rootProject.mod_homepage,
            mod_sources           : rootProject.mod_sources,
            mod_issues            : rootProject.mod_issues,
            license               : rootProject.license,
            minecraft_version_range: rootProject.minecraft_version_range,
            fabric_loader_version : rootProject.fabric_loader_version,
            java_version          : rootProject.java_version
    ]
    inputs.properties(props)
    filesMatching('fabric.mod.json') {
        expand(props)
    }
}

tasks.named('sourcesJar', Jar) {
    dependsOn(configurations.commonJava)
    from(configurations.commonJava)
}

repositories {
    maven {
        name = 'ParchmentMC'
        url = uri('https://maven.parchmentmc.org')
    }
}
