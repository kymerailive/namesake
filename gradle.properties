# Project
group=net.namesake
java_version=21

# Common
minecraft_version=1.21.1
mod_name=Namesake
mod_id=namesake
mod_author=kymerailive
mod_description=Villagers who remember your name.
mod_homepage=https://github.com/kymerailive/namesake
mod_sources=https://github.com/kymerailive/namesake
mod_issues=https://github.com/kymerailive/namesake/issues
license=LGPL-3.0

# The two loaders parse version ranges DIFFERENTLY and there is no shared syntax.
# NeoForge uses Maven ranges; Fabric uses semver predicates. Sharing one property here silently
# produces a mod that builds fine and then refuses to load on Fabric with
# "requires an unsatisfiable version range of 'Minecraft'". Keep these separate.
minecraft_version_range=[1.21, 1.22)
fabric_minecraft_version_range=>=1.21 <1.22

# Mappings
parchment_minecraft=1.21.1
parchment_version=2024.11.17

# Fabric
loom_version=1.17-SNAPSHOT
fabric_loader_version=0.19.3
fabric_api_version=0.116.13+1.21.1

# NeoForge
moddev_version=2.0.141
neo_form_version=1.21.1-20240808.144430
neoforge_version=21.1.234
neoforge_loader_version_range=[1,)
neoforge_version_range=[21.1.0,)

# Testing
junit_version=5.11.4

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.caching=true
org.gradle.parallel=true
