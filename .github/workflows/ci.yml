name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build + test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Tests run FIRST and separately, so a compile-only green can never be mistaken for a pass.
      # MCA's CI runs `build` alone, which is how it reached 34 mixins with zero tests.
      - name: Test
        run: ./gradlew test --console=plain --no-daemon

      - name: Build (Fabric + NeoForge)
        run: ./gradlew :fabric:build :neoforge:build --console=plain --no-daemon

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: namesake-jars
          path: |
            fabric/build/libs/*.jar
            neoforge/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
